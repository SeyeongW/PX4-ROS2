down_aruco_pose:
  ros__parameters:
    use_sim_time: true
    image_topic: /down_camera/image
    camera_info_topic: /down_camera/camera_info
    # The reference airframe mounts this depth camera 3 cm off-axis with a
    # different FOV, so it is not a registered per-pixel ArUco depth source.
    depth_topic: ""
    optical_frame_id: down_camera_optical_frame
    target_frame: base_link
    aruco_dictionary: DICT_4X4_50
    marker_id: 0
    marker_size_m: 1.5
    # The launch file supplies the installed one-marker layout.
    board_layout_file: ""
    minimum_board_markers: 1
    board_outlier_mad_scale: 3.5
    depth_required: false
    depth_min_m: 0.15
    depth_max_m: 80.0
    # Fix5/fix6 200 m SITL flights measured 0.0955 m and 0.0006 m residuals.
    # At their 6.9--7.4 m range this calibrated gate retains at least 3x the
    # observed error while rejecting geometrically incompatible board poses.
    depth_absolute_tolerance_m: 0.15
    depth_relative_tolerance: 0.02
    depth_sync_tolerance_s: 0.03
    max_image_age_s: 0.25
    # One source-throttled Gazebo /clock interval may trail a sensor stamp.
    # The mission node still validates the unchanged capture timestamp against
    # PX4 state history before accepting the measurement.
    max_image_future_tolerance_s: 0.10
    camera_info_timeout_s: 2.0
    # Close-range Gazebo frames occasionally add a few pixels of edge/shadow
    # error while the marker remains front-facing and geometrically valid.
    max_reprojection_error_px: 3.0
    min_facing_cosine: 0.15
    # A near-fronto-parallel downward view makes the two IPPE solutions
    # naturally close.  The 200 m SITL camera measured a 1.085 minimum and
    # 1.187 median ratio over 40 visible frames, so 1.15 caused intermittent
    # all-candidate rejection.  Keep a strict >1.0 ambiguity gate while the
    # independent facing, depth, reprojection, temporal and innovation gates
    # continue to fail closed.
    min_ambiguity_ratio: 1.0
    # Publish the first geometrically valid pose so the UAV can coast around
    # the optical intercept. The controller still requires three capture-time
    # poses for velocity and a full 1 s alignment dwell before descent.
    minimum_detection_frames: 1
    maximum_detection_gap_s: 1.0
    innovation_gate_squared: 16.27
    innovation_process_variance: 4.0
    innovation_reset_after_s: 1.0
    detected_topic: /perception/down/aruco_detected
    pose_topic: /perception/down/marker_pose
    pose_covariance_topic: /perception/down/marker_pose_covariance
    offset_topic: /perception/down/aruco_offset
    quality_topic: /perception/down/quality
    reprojection_error_topic: /perception/down/reprojection_error_px
    rejected_candidates_topic: /perception/down/rejected_candidates
    debug_topic: /perception/down/debug/compressed
    debug_raw_topic: /perception/down/debug
    # Publish the operator view with the detected square, axes and TRACK text.
    publish_debug: true
