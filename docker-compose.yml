services:
  sim-px4:
    # PX4 SITL 버전. (ArduPilot용 sim 서비스는 PX4로 전환 완료 후 제거됨.)
    build:
      context: ./docker
      dockerfile: Dockerfile.px4
      args:
        USERNAME: seo
        USER_UID: "1000"
        USER_GID: "1000"
    image: px4-ros2-sim:humble-harmonic-px4
    container_name: px4_ros2_sim_px4
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /home/seo/ros2_ws/PX4-ROS2
    environment:
      DISPLAY: ${DISPLAY}
    volumes:
      - .:/home/seo/ros2_ws/PX4-ROS2
      # PX4-Autopilot은 이미지 빌드시 이미 컴파일되어 있고, named volume이 최초 마운트
      # 시 이미지 내용을 그대로 복사해가므로 재빌드해도 유지됨(ArduPilot 쪽과 동일 패턴).
      - px4_autopilot_home:/home/seo/PX4-Autopilot
      - ros_gz_ws_home_px4:/home/seo/ros_gz_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

volumes:
  px4_autopilot_home:
  ros_gz_ws_home_px4:
