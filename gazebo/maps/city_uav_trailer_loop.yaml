# Moving-trailer pursuit scenario (SEPARATE file — does NOT modify the base map).
#
# The drone starts at the base map's spawn and chases a trailer that continuously
# drives a square loop around the map perimeter. Buildings/bounds come from the
# unchanged base map; only the trailer motion + pursuit settings live here.
# Used by:  path_plan/tools/pursuit_sim.py

base_map: gazebo/maps/city_coordinates_uav.yaml   # buildings + geofence (unchanged)

drone:
  spawn_enu_m: [587.0, 580.0, 15.0]   # NE corner (base-map spawn), mid-band cruise 15 m
  cruise_floor_m: 10.0                # 10-20 m cruise band (same as visualize_pipeline)
  cruise_ceiling_m: 20.0
  cruise_speed_m_s: 10.0               # faster than the trailer so it can intercept
  inflation_xy_m: 1.0                 # 1 m wall clearance
  overfly_allowed: true               # climb within the 10-20 m band to overfly buildings

trailer:
  motion: perimeter_square_loop
  half_size_m: 600.0                  # loop runs along x,y = ±600 (building-clear ring)
  speed_m_s: 6.0
  start_corner: SW                    # start opposite the NE drone spawn -> real chase
  direction: ccw
  deck_height_m: 1.25
  footprint_m: [5.5, 3.0]
  # Building-CLEAR closed loop through the real Gazebo city (min 6.9 m clearance to
  # any building, ~4068 m perimeter). The GAZEBO trailer physically collides with the
  # 205 building collisions, so the analytic square (which crosses buildings) jams it;
  # this waypoint circuit weaves through the open gaps. trailer_loop_driver follows
  # these when present; tools/pursuit_sim.py (no collision) keeps using the square.
  # Generated once by A* over the inflated footprints; wp[0] == trailer spawn (-587,
  # -512, 2.8 m away, 31.6 m clear) so the trailer starts ON the loop (no cross-map dash).
  loop_waypoints_enu:
    - [-585.0, -510.0]
    - [-360.0, -550.0]
    - [-280.0, -615.0]
    - [190.0, -595.0]
    - [265.0, -530.0]
    - [480.0, -490.0]
    - [495.0, -470.0]
    - [540.0, -225.0]
    - [600.0, -180.0]
    - [610.0, 245.0]
    - [605.0, 250.0]
    - [595.0, 350.0]
    - [520.0, 400.0]
    - [-290.0, 515.0]
    - [-310.0, 505.0]
    - [-310.0, 500.0]
    - [-305.0, 430.0]
    - [-290.0, 415.0]
    - [-350.0, -35.0]
    - [-410.0, -80.0]
    - [-430.0, -290.0]
    - [-510.0, -340.0]
    - [-540.0, -495.0]

pursuit:
  capture_radius_m: 5.0               # success when drone-trailer xy distance < this
  replan_period_s: 6.0               # global A*->SFC->B-spline replan cadence (open chase)
  terminal_homing_m: 40.0            # inside this range the MPC homes straight at the trailer
  # res 10 A* is ~19 s per replan on the (now 20-50 m) city map, so a full ~400 s
  # chase took ~15 min and the animation (which renders only AFTER the sim) never
  # appeared.  res 18 A* is ~3 s/replan (still valid paths); max_sim_time bounds the
  # run so the animation actually shows.  Raise max_sim_time_s for a full capture.
  astar_resolution_m: 18.0
  sim_dt_s: 0.1                       # = MPC control step
  max_sim_time_s: 150.0
