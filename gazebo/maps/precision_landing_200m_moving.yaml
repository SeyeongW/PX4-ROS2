schema_version: 2
map:
  name: precision_landing_200m_moving
  gazebo_world_name: precision_landing_200m_moving
  world_file: gazebo/worlds/precision_landing_200m_moving.world
  bounds_enu_m:
    x: [0.0, 200.0]
    y: [0.0, 200.0]

frames:
  gazebo_world:
    convention: ENU
    x_axis: east
    y_axis: north
    z_axis: up
    units: m
  mavros_local:
    convention: ENU
    origin_enu_m: [30.0, 30.0, 0.24]

px4_vehicle:
  airframe_autostart_id: 4001
  simulation_model: gz_x500_city_rgbd_lidar
  runtime_entity_name: x500_city_rgbd_lidar_0
  model_source: px4_models/x500_city_rgbd_lidar/model.sdf
  spawn_mode: dynamic_by_px4_sitl
  sitl_parameter_overrides:
    # Match the PX4 executable envelope to the values recorded in the
    # flight-verified 9 m/s ULog.  The old non-isolated SITL rootfs retained
    # these values even though its launcher did not print them.
    MPC_XY_VEL_MAX: 11.0
    MPC_ACC_HOR: 3.0
    MPC_ACC_HOR_MAX: 3.0
    MPC_JERK_AUTO: 5.0
    MPC_JERK_MAX: 5.0
    # Use PX4's normal multicopter threshold.  The former 0.05 m/s override
    # rejected the measured 0.02--0.11 m/s contact-settle motion, so
    # ground_contact only flickered and never completed its PX4 dwell.
    LNDMC_Z_VEL_MAX: 0.25
    # PX4's stock SITL land detector compares world-frame horizontal speed.
    # The mission independently requires camera-relative XY speed <= 0.35
    # m/s; this simulation-only ceiling permits contact at the 9 m/s target.
    LNDMC_XY_VEL_MAX: 10.0
    COM_DISARM_LAND: 10.0

spawn:
  name: precision_landing_drone_spawn
  gazebo_spawn_pose_enu:
    x: 30.0
    y: 30.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

trailer:
  entity_name: trailer
  model_uri: model://moving_platform_aruco_velocity
  spawn_pose_enu:
    x: 37.071067811865476
    y: 37.071067811865476
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  separation_m: 10.0
  motion: configurable_speed_circle_after_px4_spawn
  command_topic: /model/trailer/cmd_vel
  pose_topic: /world/precision_landing_200m_moving/dynamic_pose/info
  odometry_topic: /model/trailer/odometry
  route_type: circle
  circle_center_enu_m: [72.42640687119285, 72.42640687119285]
  circle_radius_m: 50.0
  circle_direction: counterclockwise
  command_rate_hz: 50.0
  cruise_speed_m_s: 9.0
  # A 9 m/s, 50 m circle needs 1.62 m/s^2 centripetal acceleration.
  acceleration_m_s2: 2.0
  waypoint_tolerance_m: 0.2
  body_footprint_m: [5.0, 5.0]
  deck_height_m: 2.05
  marker_surface_height_m: 2.051
  marker_size_m: 1.5
  aruco_dictionary: DICT_4X4_50
  aruco_marker_id: 0

terrain:
  type: flat_box
  size_m: [200.0, 200.0]
  ground_z_m: 0.0
