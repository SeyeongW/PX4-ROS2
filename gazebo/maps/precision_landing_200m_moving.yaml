schema_version: 2
map:
  name: precision_landing_200m_moving
  gazebo_world_name: precision_landing_200m_moving
  world_file: gazebo/worlds/precision_landing_200m_moving.world
  bounds_enu_m:
    x: [0.0, 200.0]
    y: [0.0, 200.0]

frames:
  gazebo_world:
    convention: ENU
    x_axis: east
    y_axis: north
    z_axis: up
    units: m
  mavros_local:
    convention: ENU
    origin_enu_m: [30.0, 30.0, 0.24]

px4_vehicle:
  airframe_autostart_id: 4001
  simulation_model: gz_x500_city_rgbd_lidar
  runtime_entity_name: x500_city_rgbd_lidar_0
  model_source: px4_models/x500_city_rgbd_lidar/model.sdf
  spawn_mode: dynamic_by_px4_sitl
  sitl_parameter_overrides:
    LNDMC_Z_VEL_MAX: 0.05
    # PX4's stock land detector compares world-frame horizontal speed. The
    # aircraft is physically at rest relative to the 3 m/s deck, so retain a
    # small margin above that known platform speed in this SITL profile.
    LNDMC_XY_VEL_MAX: 4.0
    COM_DISARM_LAND: 10.0

spawn:
  name: precision_landing_drone_spawn
  gazebo_spawn_pose_enu:
    x: 30.0
    y: 30.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

trailer:
  entity_name: trailer
  model_uri: model://moving_platform_aruco_velocity
  spawn_pose_enu:
    x: 37.071067811865476
    y: 37.071067811865476
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  separation_m: 10.0
  motion: circle_3_m_s_after_px4_spawn
  command_topic: /model/trailer/cmd_vel
  pose_topic: /world/precision_landing_200m_moving/dynamic_pose/info
  odometry_topic: /model/trailer/odometry
  route_type: circle
  circle_center_enu_m: [72.42640687119285, 72.42640687119285]
  circle_radius_m: 50.0
  circle_direction: counterclockwise
  command_rate_hz: 50.0
  cruise_speed_m_s: 3.0
  acceleration_m_s2: 1.0
  waypoint_tolerance_m: 0.2
  body_footprint_m: [5.0, 5.0]
  deck_height_m: 2.05
  marker_surface_height_m: 2.051
  marker_size_m: 1.5
  aruco_dictionary: DICT_4X4_50
  aruco_marker_id: 0

terrain:
  type: flat_box
  size_m: [200.0, 200.0]
  ground_z_m: 0.0
