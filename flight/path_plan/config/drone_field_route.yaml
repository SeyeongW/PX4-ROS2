# Drone-relative, obstacle-free field map for `run_px4 trailer`.
#
# Unlike drone_cju_route.yaml, this map is NOT pinned to a surveyed WGS84 site.
# `drone_relative: true` tells the hardware node to place the map origin at the
# vehicle's own local ENU origin (0, 0) — so wherever the drone launches, the
# map is automatically centred on the drone. No GPS survey, no fixed lat/lon,
# and no anchor drift from real GPS/pose jitter.
#
# There are no obstacles: the mission flies a straight A* -> B-spline route from
# the launch point to the goal and then hunts the ArUco marker. This map is
# approved for props-on use by construction — an empty, drone-centred field has
# nothing to collide with (the barriers only ever existed in the CJU
# simulation). Keep drone_cju_route.yaml for the surveyed CJU layout; select it
# with `ROUTE_MAP=.../drone_cju_route.yaml run_px4 trailer`.
schema_version: 1

site:
  name: Drone-relative field (auto-centred on launch)
  coordinate_frame: field
  # drone_relative maps carry no fixed WGS84 origin; the vehicle's launch point
  # is the origin. heading 0 aligns the map frame with the vehicle's local ENU.
  drone_relative: true
  heading_deg_enu: 0.0
  horizontal_accuracy: drone_relative_local_enu
  hardware_flight_approved: true

terrain:
  coordinate_frame: field
  # Centred between launch (0, 0) and goal (50, 50), large enough that both sit
  # well inside the clearance-shrunk bounds.
  center_m: [25, 25]
  size_m: [200, 200]

mission:
  coordinate_frame: field
  goal_m: [50, 50]
  cruise_altitude_m: 5.0
  planner_resolution_m: 1.0
  vehicle_clearance_xy_m: 1.0
  bspline_control_spacing_m: 1.0
  bspline_sample_spacing_m: 0.1
  obstacles: []
