# Drone-relative OBSTACLE field for `run_px4 trailer`.
#
# Purpose: a props-on demonstration of fast obstacle avoidance while tracking a
# dynamic target (the trailer). The obstacles are virtual — they exist only in
# this map and in RViz, not physically in the field — so a "collision" is
# harmless and the hardware approval gate can stay off. But they are REAL to the
# planner: A* -> SFC -> B-spline routes around them and the RViz markers show the
# drone weaving through the field it is avoiding.
#
# Unlike drone_cju_route.yaml this map is NOT pinned to a surveyed WGS84 site.
# `drone_relative: true` places the map origin at the vehicle's own local ENU
# origin (0, 0), so the whole obstacle field is auto-centred on wherever the
# drone launches — no GPS survey, no fixed lat/lon, and no anchor drift from
# real GPS/pose jitter. heading 0 aligns the map frame with the vehicle's local
# ENU, so an obstacle at map (33, 10) sits 33 m east and 10 m north of launch.
#
# LAYOUT — sparse pillars, tuned to be FLYABLE, not just plannable.
# Individual pillars (not walls) straddle the launch->goal diagonal, alternating
# left/right, so the straight line is blocked and the planner weaves (~2.8 m of
# lateral swing). They are deliberately sparse: A* stays ~4x faster than a dense
# wall slalom (so replans come quickly), and there is always open space to
# either side, so a vehicle that drifts off the line can re-route around a pillar
# instead of being walled in. This matters on the real aircraft, where the
# follower replans from the current position whenever it deviates or stalls; a
# tight wall slalom starved that recovery and produced a mid-field HOLD.
# Select the surveyed CJU layout instead with
# `ROUTE_MAP=.../drone_cju_route.yaml run_px4 trailer`.
schema_version: 1

site:
  name: Drone-relative pillar field (auto-centred on launch)
  coordinate_frame: field
  drone_relative: true
  heading_deg_enu: 0.0
  horizontal_accuracy: drone_relative_local_enu
  # Virtual obstacles: a simulated collision breaks nothing, so props-on is
  # approved here even though the field is not a surveyed site.
  hardware_flight_approved: true

terrain:
  coordinate_frame: field
  # Covers the whole MISSION, not just the launch->goal leg. The box is the
  # planner's search extent and `_world` shrinks it by vehicle_clearance_xy_m,
  # so [25,25]+-45 left a usable region of [-19, 69] — only 19 m behind launch.
  # The return leg goes behind launch, to a trailer that parks where it likes,
  # and a flight put the vehicle at y = -22.2: three metres outside.
  #
  # OUTSIDE THE BOX IS NOT NEAR AN OBSTACLE, BUT IT FAILS THE SAME CHECK. At
  # that position `clearance()` read 33.9 m and `segment_is_free()` still said
  # False, so `splice_route_from_current` could not certify a chord from the
  # vehicle's true position and EVERY plan was rejected — 19 consecutive
  # stuck-replans, all 'current position cannot safely join the completed
  # route'. `nearest_free_point` rescued the A* start but not the splice.
  # The same clamp silently shortens a return: a trailer past the edge is
  # projected onto it, so the vehicle flies to the boundary, not to the
  # trailer.
  #
  # [15,15]+-51 gives a usable [-35, 65]: 35 m behind launch for the return,
  # 15 m past the goal, and the pillars are unmoved (they are absolute in this
  # frame).
  #
  # WHY NOT ENORMOUS, SINCE IT IS FREE. It is free: the geometry is lazy, not a
  # dense grid, and A* is goal-directed, so plan time, build time and memory
  # measure flat from 102 m to 800 m a side (~355 ms, ~11 ms, ~130 KB at every
  # size); an out-of-box goal is refused by a precheck before A* runs. The
  # limit is honesty, not cost. Inside the box the map asserts where the
  # obstacles are; outside it, it knows nothing. Widening the box does not
  # survey anything — it just extends the claim "this is clear" over ground
  # nobody checked, and the planner will route straight through whatever is
  # actually there. The edge is where this map's knowledge ends, so it belongs
  # where the mission ends. Grow it deliberately when the mission grows.
  center_m: [15, 15]
  size_m: [102, 102]

mission:
  coordinate_frame: field
  goal_m: [50, 50]
  cruise_altitude_m: 5.0
  planner_resolution_m: 1.0
  vehicle_clearance_xy_m: 1.0
  bspline_control_spacing_m: 1.0
  bspline_sample_spacing_m: 0.1
  # Seven pillars straddling the launch->goal diagonal, alternating side, so the
  # route zig-zags around them without any of them fully blocking a lane.
  obstacles:
    - {name: pillar_1, center_m: [5.66, 7.07, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_2, center_m: [11.31, 9.90, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_3, center_m: [14.14, 15.56, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_4, center_m: [19.80, 18.38, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_5, center_m: [22.63, 24.04, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_6, center_m: [28.28, 26.87, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_7, center_m: [31.11, 32.53, 5], size_m: [0.6, 0.6, 10]}
