    - {name: barrier_15, center_m: [49, 4, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_16, center_m: [21, 3, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_17, center_m: [15, 34, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_18, center_m: [42, 41, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_19, center_m: [35, 49, 5], size_m: [0.45, 0.35, 10]}
