# Drone-relative OBSTACLE field for `run_px4 trailer`.
#
# Purpose: a props-on demonstration of fast obstacle avoidance while tracking a
# dynamic target (the trailer). The obstacles are virtual — they exist only in
# this map and in RViz, not physically in the field — so a "collision" is
# harmless and the hardware approval gate can stay off. But they are REAL to the
# planner: A* -> SFC -> B-spline routes around them and the RViz markers show the
# drone weaving through the field it is avoiding.
#
# Unlike drone_cju_route.yaml this map is NOT pinned to a surveyed WGS84 site.
# `drone_relative: true` places the map origin at the vehicle's own local ENU
# origin (0, 0), so the whole obstacle field is auto-centred on wherever the
# drone launches — no GPS survey, no fixed lat/lon, and no anchor drift from
# real GPS/pose jitter. heading 0 aligns the map frame with the vehicle's local
# ENU, so an obstacle at map (33, 10) sits 33 m east and 10 m north of launch.
#
# LAYOUT — a slalom, tuned for easy verification.
# Launch is map (0, 0); the goal is (50, 50). Four barrier WALLS cross the
# launch->goal diagonal, each with a single opening ("gate") that alternates
# left/right of the centreline. Going around a wall is longer than threading the
# next gate, so the collision-free route the planner finds is a clear left-right
# zig-zag (~3 side-changes, ~+-3.4 m of lateral swing) — obvious in RViz. The
# walls are built from thin barriers spaced 2 m so their 1 m keep-outs merge into
# a continuous wall the planner cannot slip through. Select the surveyed CJU
# layout instead with `ROUTE_MAP=.../drone_cju_route.yaml run_px4 trailer`.
schema_version: 1

site:
  name: Drone-relative slalom field (auto-centred on launch)
  coordinate_frame: field
  drone_relative: true
  heading_deg_enu: 0.0
  horizontal_accuracy: drone_relative_local_enu
  # Virtual obstacles: a simulated collision breaks nothing, so props-on is
  # approved here even though the field is not a surveyed site.
  hardware_flight_approved: true

terrain:
  coordinate_frame: field
  # Centred between launch (0, 0) and goal (50, 50), sized so the walls span most
  # of the usable width — the drone must use the gates, not detour around.
  center_m: [25, 25]
  size_m: [75, 75]

mission:
  coordinate_frame: field
  goal_m: [50, 50]
  cruise_altitude_m: 5.0
  planner_resolution_m: 1.0
  vehicle_clearance_xy_m: 1.0
  bspline_control_spacing_m: 1.0
  bspline_sample_spacing_m: 0.1
  # A four-gate slalom across the launch->goal diagonal. Each wall is a line of
  # thin barriers perpendicular to the diagonal with one opening; the opening
  # alternates side (left, right, left, right) so the route zig-zags.
  obstacles:
    # gate 1: wall crossing the diagonal at ~14 m, opening on the left (map perp +6 m)
    - {name: g1_-14, center_m: [19.80, 0.00, 5], size_m: [0.45, 0.35, 10]}
