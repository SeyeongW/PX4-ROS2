# Hardware-route snapshot extracted from Wang's drone_cju_track simulation map.
#
# IMPORTANT: the transform and planner are testable, but this snapshot is not a
# props-on safety map. The origin/heading came from OSM-scale alignment and the
# 25 barriers are the simulation layout, not a field survey. Set
# hardware_flight_approved true only after measuring the origin, heading and
# every obstacle in the physical test area, confirming the residual map error
# is within 0.25 m, and demonstrating at least the mission node's configured
# route braking deceleration plus its maximum reaction/watchdog time on the
# loaded real airframe.
schema_version: 1

site:
  name: Cheongju University Main Complex Stadium (No. 40)
  coordinate_frame: stadium_endpoint
  origin_wgs84: [36.653960886920, 127.495466874950]
  heading_deg_enu: 6.307121199814
  horizontal_accuracy: osm_scale_visual_not_survey_grade
  hardware_flight_approved: false

terrain:
  coordinate_frame: stadium_endpoint
  center_m: [46, 49]
  size_m: [128, 226]

mission:
  coordinate_frame: stadium_endpoint
  cruise_altitude_m: 5.0
  planner_resolution_m: 1.0
  vehicle_clearance_xy_m: 1.0
  # Requested geometric route margin beyond the 1 m vehicle clearance.
  bspline_clearance_margin_m: 1.0
  # Extra centreline room so a real follower can recover while its checked
  # chord and stopping envelope still keep the 1 m margin above.
  route_following_reserve_m: 0.5
  bspline_control_spacing_m: 1.0
  bspline_sample_spacing_m: 0.1
