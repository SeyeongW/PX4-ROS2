# Drone-relative COMPLEX (maze) obstacle field — opt-in demo map.
#
# Same drone-relative contract as drone_field_route.yaml (origin at the vehicle's
# own local ENU (0,0), heading 0, hardware_flight_approved, virtual obstacles),
# but a denser 25-pillar maze for a more elaborate avoidance demonstration: the
# planned route makes ~7 direction changes weaving through it. Individual pillars
# (never walls), so there is always open space to re-route around one — the
# vehicle's deviation/stuck replan can always recover.
#
# NOT the default: A* is slower on a field this dense (heavier replans on the
# Jetson), so drone_field_route.yaml (7 pillars, fast) stays the default. Select
# this one explicitly:
#   ROUTE_MAP=$(dirname "$0")/drone_maze_route.yaml   # or the full path
#   ROUTE_MAP=.../config/drone_maze_route.yaml ./run_px4 trailer
schema_version: 1

site:
  name: Drone-relative pillar maze (auto-centred on launch)
  coordinate_frame: field
  drone_relative: true
  heading_deg_enu: 0.0
  horizontal_accuracy: drone_relative_local_enu
  hardware_flight_approved: true

terrain:
  coordinate_frame: field
  # Same extent as drone_field_route.yaml, and for the same reason: the old
  # [25,25]+-45 box left only 19 m behind launch once vehicle_clearance_xy_m
  # was subtracted, and the return leg goes behind launch. A vehicle outside
  # the box fails segment_is_free exactly like one inside a pillar, so no plan
  # can be spliced from its true position. [15,15]+-51 gives [-35, 65].
  center_m: [15, 15]
  size_m: [102, 102]

mission:
  coordinate_frame: field
  goal_m: [50, 50]
  cruise_altitude_m: 5.0
  planner_resolution_m: 1.0
  vehicle_clearance_xy_m: 1.0
  bspline_control_spacing_m: 1.0
  bspline_sample_spacing_m: 0.1
  # A 25-pillar maze straddling the whole launch->goal corridor. The route weaves
  # ~7 times through it; each pillar is isolated, so none blocks a lane outright.
  obstacles:
    - {name: pillar_1, center_m: [5.93, 6.68, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_2, center_m: [9.51, 16.41, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_3, center_m: [5.97, 23.67, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_4, center_m: [7.9, 30.3, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_5, center_m: [9.17, 38.07, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_6, center_m: [15.46, 8.08, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_7, center_m: [15.65, 16.43, 5], size_m: [0.6, 0.6, 10]}
    - {name: pillar_8, center_m: [17.19, 26.28, 5], size_m: [0.6, 0.6, 10]}
