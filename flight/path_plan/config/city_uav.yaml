# path_plan pipeline parameters for the applepark_city_uav map.
# map_yaml is overridden by the launch file with an absolute path.

/astar_planner:
  ros__parameters:
    resolution_m: 8.0           # coarser grid = far fewer cells (huge speed-up); 26 m wall
                                # clearance means 8 m grid is plenty precise (was 4.0 = ~77 s)
    inflation_xy_m: 5.0         # wall clearance: path-centre >= 5 m from any wall
    roof_clearance_m: 10.0
    cruise_floor_m: 30.0
    cruise_ceiling_m: 40.0
    overfly_allowed: false      # every building = full-height no-fly column (avoid all)
    max_expanded: 400000
    # start = PX4 spawn (NE corner); goal = stationary trailer (SW corner).
    start_enu_m: [587.0, 580.0, 35.0]
    goal_enu_m: [-587.0, -512.0, 35.0]
    # Optional ordered via-points (flat [x,y,z, x,y,z, ...]). The path is forced
    # through each, so use them to shape a hard/slalom route. Empty = direct.
    # e.g. [300.0, 300.0, 25.0,  0.0, 100.0, 25.0,  -150.0, -100.0, 25.0]
    waypoints_enu_m: []
    # shaped-cost weights (BigZaphod-style pluggable cost function)
    clearance_weight: 2.0      # penalty per metre inside clearance_pref of a wall
    clearance_pref_m: 5.0       # want >= this much gap to the nearest building
    altitude_weight: 0.05      # penalty per metre off the preferred cruise height
    altitude_pref_m: 35.0      # middle of the 30-40 m band
    climb_weight: 0.5          # extra penalty per metre of upward motion
    # weighted A* (f = g + weight*h): >1 makes the search greedier toward the goal,
    # expanding far fewer nodes.  1.5 = ~25x faster (77s->3s) with the SAME 26 m wall
    # clearance here; raise to 2.0 for ~0.8 s (may take slightly longer detours).
    heuristic_weight: 1.5

/sfc_builder:
  ros__parameters:
    inflation_xy_m: 5.0
    roof_clearance_m: 10.0
    cruise_floor_m: 30.0
    cruise_ceiling_m: 40.0
    overfly_allowed: false
    step_m: 0.5
    max_extent_m: 8.0
    seed_spacing_m: 3.0

/bspline_optimizer:
  ros__parameters:
    # obstacle model must match the other nodes (used for the rebound collision check)
    inflation_xy_m: 5.0
    roof_clearance_m: 10.0
    cruise_floor_m: 30.0
    cruise_ceiling_m: 40.0
    overfly_allowed: false
    # ego-planner corridor B-spline optimizer (L-BFGS + rebound).
    # Trajectory speed = the real cap on cruise: the MPC tracks this velocity profile,
    # so it must match the MPC/PX4 limits or the drone stays slow. (PX4 MPC_XY_VEL_MAX
    # defaults to 12, so keep <=12 unless you also raise that FCU param.)
    cruise_speed_m_s: 10.0
    ctrl_spacing_m: 5.0     # control-point spacing (also one free box each)
    max_vel_m_s: 12.0
    max_acc_m_s2: 4.0
    lambda_smooth: 5.0      # jerk
    lambda_dist: 0.5        # corridor rebound
    lambda_feas: 2.0        # velocity/accel limits
    lambda_fit: 0.05         # guide-path alignment
    demarcation_m: 0.3      # keep control points this far inside their box
    max_rebound: 10
    sample_count: 300

/tracking_mpc:
  ros__parameters:
    # Active controller:
    #   mpc      = TrackingMPC, a REAL optimisation MPC (condensed QP + SLSQP, |v|/|a|
    #              constraints, terminal cost) over a HOLONOMIC 3D double-integrator.
    #              Holonomic suits a strafing multicopter, so it is a true MPC without
    #              the unicycle's nose-coupled limit-cycle spin.  [DEFAULT]
    #   pursuit  = lightweight holonomic pure-pursuit law (fast, not an MPC).
    #   unicycle = mpc_ros UnicycleMPC (needs a slow-yaw ground-like vehicle).
    controller: mpc
    dt_s: 0.1
    horizon: 20
    v_ref_m_s: 12.0     # cruise speed (pursuit/unicycle); MPC tracks the B-spline vel
    v_max_m_s: 12.0     # hard |v| limit (all controllers); PX4 MPC_XY_VEL_MAX caps this
    a_max_m_s2: 5.0     # hard |a| limit (raised so it can reach speed + turn at 12 m/s)
    # TrackingMPC cost weights (position / velocity / accel-effort / terminal).
    mpc_q_pos: 4.0
    mpc_q_vel: 0.4
    mpc_r_acc: 0.05
    mpc_q_terminal: 20.0
    # Unicycle/pursuit-only vertical + yaw settings.
    omega_max_rad_s: 1.2
    z_kp: 0.8            # altitude-hold P gain (pursuit decoupled vertical)
    vz_max_m_s: 2.0
    # mpc_ros cost weights
    w_cte: 6.0          # cross-track error (raised: tighter path adherence)
    w_epsi: 4.0         # heading error
    w_v: 1.0            # speed vs v_ref
    w_omega: 1.0        # yaw-rate effort
    w_a: 0.05           # accel effort
    w_domega: 6.0       # yaw-rate smoothness (raised: less weaving)
    w_da: 0.5           # accel smoothness
    depth_trigger_m: 10.0
    depth_emergency_m: 4.0
    avoid_lateral_m: 7.0
