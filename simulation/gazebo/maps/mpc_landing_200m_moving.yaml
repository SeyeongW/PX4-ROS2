schema_version: 2
map:
  name: mpc_landing_200m_moving
  gazebo_world_name: mpc_landing_200m_moving
  world_file: gazebo/worlds/mpc_landing_200m_moving.world
  bounds_enu_m:
    x: [0.0, 1000.0]
    y: [0.0, 100.0]
  profile:
    geometry: restored_pre_cju_flat_world
    experiment: 1000m_forward_reverse_linear_shuttle
    legacy_name_retained_for_topic_compatibility: true

frames:
  gazebo_world:
    convention: ENU
    x_axis: east
    y_axis: north
    z_axis: up
    units: m
  mavros_local:
    convention: ENU
    origin_enu_m: [15.0, 40.0, 0.24]

px4_vehicle:
  airframe_autostart_id: 4001
  simulation_model: gz_x500_city_rgbd_lidar
  runtime_entity_name: x500_city_rgbd_lidar_0
  model_source: px4_models/x500_city_rgbd_lidar/model.sdf
  spawn_mode: dynamic_by_px4_sitl
  # Tilt-decoupled alternative, selected with GIMBAL=1.  It is a strict
  # SUPERSET of the baseline vehicle (same links, sensors and topics plus a
  # slung 3-axis camera gimbal), so the map, trailer route and every mission
  # parameter stay identical and only the vehicle changes.  That is what makes
  # a body-fixed vs gimbal-stabilised comparison a controlled experiment.
  gimbal_variant:
    simulation_model: gz_x500_gimbal_rgbd_lidar
    runtime_entity_name: x500_gimbal_rgbd_lidar_0
    model_source: px4_models/x500_gimbal_rgbd_lidar/model.sdf
  sitl_parameter_overrides:
    LNDMC_Z_VEL_MAX: 0.05
    # PX4's stock land detector compares world-frame horizontal speed.  The
    # mission independently requires camera-relative XY speed <= 0.35 m/s;
    # this world-frame ceiling leaves margin for the unified 3 m/s target.
    LNDMC_XY_VEL_MAX: 6.0
    COM_DISARM_LAND: 10.0

spawn:
  name: mpc_landing_drone_spawn
  gazebo_spawn_pose_enu:
    x: 15.0
    y: 40.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

trailer:
  entity_name: trailer
  model_uri: model://moving_platform_aruco_velocity
  spawn_pose_enu:
    x: 0.0
    y: 50.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    # Keep model yaw at zero: Gazebo VelocityControl interprets linear cmd_vel
    # in model axes. The platform is intentionally not steered.
    yaw: 0.0
  separation_m: 18.027756377319946
  motion: 1000m_forward_then_1000m_reverse_after_px4_spawn
  command_topic: /model/trailer/cmd_vel
  pose_topic: /world/mpc_landing_200m_moving/dynamic_pose/info
  odometry_topic: /model/trailer/odometry
  # The model keeps yaw=0 throughout. Positive x is forward; at x=1000 the
  # controller changes only the velocity sign, so the return is true reverse.
  # One completed loop is the full 2,000 m out-and-back cycle.
  route_type: linear_shuttle
  shuttle_endpoints_enu_m:
    - [0.0, 50.0]
    - [1000.0, 50.0]
  shuttle_leg_length_m: 1000.0
  route_length_m: 2000.0
  patrol_mode: repeat
  outbound_motion: forward_positive_x
  inbound_motion: reverse_negative_x
  command_rate_hz: 50.0
  cruise_speed_m_s: 3.0
  acceleration_m_s2: 2.0
  turnaround_creep_speed_m_s: 0.1
  turnaround_brake_margin_m: 0.05
  # Paper-profile validation gates. A run cannot report PASS if the vehicle
  # starts off-axis, leaves the centreline/end apron excessively, or never
  # reaches the commanded 3 m/s in both directions.
  shuttle_spawn_tolerance_m: 0.01
  shuttle_yaw_tolerance_deg: 0.1
  shuttle_max_cross_track_error_m: 0.05
  shuttle_max_endpoint_excursion_m: 0.05
  shuttle_min_cruise_ratio: 0.99
  waypoint_tolerance_m: 0.2
  body_footprint_m: [5.0, 5.0]
  deck_height_m: 2.05
  marker_surface_height_m: 2.051
  aruco_dictionary: DICT_4X4_50
  # A LADDER of marker sizes, not one marker.  A marker is fully in frame only
  # above h = s/(2 tan(vfov/2)), so a single 1.5 m code went blind at 0.97 m —
  # above the 0.25 m touchdown — and the vehicle landed on whatever drift it
  # had accumulated over that last 0.72 m (~36 cm at |v_rel| 0.3 m/s).
  #
  # The small marker holds the DECK CENTRE, and it must: at h = 0.3 m the
  # camera sees only a 0.23 m radius, so anything offset is already gone.  It
  # CANNOT sit inside a big marker — DICT_4X4_50 is 4x4 data plus a 1-cell
  # border = 6 cells, so a 0.39 m inner plane wipes the middle 2x2 of them,
  # which are data bits, and the big marker stops decoding.  The big markers
  # are therefore placed SYMMETRICALLY about the small one: the pattern as a
  # whole is concentric with the landing point and nothing is lopsided.
  #   big   id 0, 1.30 m code, centred at (-1.10, 0)
  #   big   id 2, 1.30 m code, centred at (+1.10, 0)   mirror of id 0
  #   small id 1, 0.30 m code, centred at ( 0.00, 0)
  # All three report the SAME landing point (the deck centre); the detector
  # cross-checks them whenever more than one is in view.
  # Coverage: big usable 16 m -> 2.0 m, small below 3.88 m, blind only below
  # 0.19 m.  Measured on synthetic renders: <=1.6 cm at every height.
  marker_size_m: 1.3
  aruco_marker_id: 0
  small_marker_size_m: 0.30
  small_aruco_marker_id: 1
  marker_offset_m: [-1.1, 0.0]
  marker_2_offset_m: [1.1, 0.0]

obstacles:
  count: 0
  collision_enabled: false
  visual_enabled: false

benchmark:
  protocol: linear_shuttle_1000m_forward_reverse_v1
  purpose: moving_target_precision_landing
  initial_snapshot:
    drone_enu_m: [15.0, 40.0, 0.0]
    trailer_deck_center_enu_m: [0.0, 50.0, 2.051]
    horizontal_separation_m: 18.027756377319946
    direct_path_blocked: false
    direct_path_obstacles: []
  outbound_distance_m: 1000.0
  inbound_reverse_distance_m: 1000.0
  cycle_distance_m: 2000.0
  nominal_cruise_leg_duration_s: 333.3333333333333
  nominal_cruise_cycle_duration_s: 666.6666666666666
  evaluation_metrics:
    - successful_intercept
    - shuttle_endpoint_error_m
    - shuttle_cross_track_error_m
    - shuttle_speed_rmse_m_s
    - shuttle_yaw_drift_deg
    - time_to_intercept_s
    - time_to_land_s
    - path_length_m
    - control_effort
    - altitude_constraint_violations

terrain:
  type: flat_box
  size_m: [1000.0, 100.0]
  # Invisible collision support extends 5 m beyond the nominal boundary so
  # the full 5 x 5 m platform remains supported at x=0 and x=1000.
  support_collision_size_m: [1010.0, 110.0]
  ground_z_m: 0.0
