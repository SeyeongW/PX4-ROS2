schema_version: 2
map:
  name: drone_cju
  gazebo_world_name: drone_cju
  world_file: gazebo/worlds/drone_cju.world
  bounds_enu_m:
    x: [-46.327675738662, 105.725453481149]
    y: [-0.596778313793, 238.097118087389]
  real_world_reference:
    name: Cheongju University Main Complex Stadium (No. 40)
    horizontal_datum: WGS84
    horizontal_source: OpenStreetMap ways 1374978221 and 431113163
    horizontal_accuracy: osm_scale_visual_with_integer_southwest_origin_not_survey_grade
    source_track_center_wgs84: [36.654416832792, 127.495903519248]
    elevation_m_approx: 74.0
    spherical_origin_wgs84: [36.6533752165, 127.4955858675, 74.0]
    # Local +x points approximately east; the physical stadium long axis is +y.
    model_heading_deg_enu: 6.307121199814
    stadium_long_axis_heading_deg_enu: 96.307121199814
    stadium_outline_osm_way: 431113163
    stadium_footprint_m: [226, 128]
    # Physical long-axis x short-axis dimensions from OSM way 1374978221.
    track_footprint_m: [178.7, 87.4]
    track_bounds_stadium_endpoint_m:
      x: [0.6, 88]
      y: [-43.35, 135.35]
    site_bounds_stadium_endpoint_m:
      x: [-18, 110]
      y: [-64, 162]
    source_notes: gazebo/CJU_STADIUM_WORLD.md
  variant:
    based_on: mpc_landing_200m_moving
    isolated_assets: true
    visual_changes:
      - integer_operational_anchors
      - positive_southwest_origin
      - stadium_field_only
      - red_running_track
      - eight_lane_markings
      - basketball_court
      - jokgu_court
      - enlarged_vertical_jokgu_court

frames:
  gazebo_world:
    convention: ENU
    x_axis: east
    y_axis: north
    z_axis: up
    units: m
  stadium_endpoint:
    convention: track_aligned_xy
    # Integer south-west staging origin; +x is east and +y is north.
    origin_track_center_local_m: [-44, -46]
    origin_wgs84: [36.653960886920, 127.495466874950, 74.0]
    origin_enu_m: [-10.639652792208, 64.993290731978, 0.0]
    heading_deg_enu: 6.307121199814
    track_center_m: [44, 46]
  stadium_center:
    parent: stadium_endpoint
    origin_m: [44, 46, 0]
  mavros_local:
    convention: ENU
    # PX4 spawns the model root at the 2.051 m deck; base_link is 0.24 m higher.
    origin_enu_m: [-5.669916246818, 65.542579972196, 2.291]

px4_vehicle:
  airframe_autostart_id: 4001
  simulation_model: gz_x500_city_rgbd_lidar
  runtime_entity_name: x500_city_rgbd_lidar_0
  model_source: px4_models/x500_city_rgbd_lidar/model.sdf
  spawn_mode: dynamic_by_px4_sitl
  gimbal_variant:
    simulation_model: gz_x500_gimbal_rgbd_lidar
    runtime_entity_name: x500_gimbal_rgbd_lidar_0
    model_source: px4_models/x500_gimbal_rgbd_lidar/model.sdf
  sitl_parameter_overrides:
    # PX4 owns takeoff, route dynamics, precision landing and auto-disarm.
    MIS_TAKEOFF_ALT: 5.0
    MPC_TKO_SPEED: 0.5
    MPC_XY_CRUISE: 3.0
    MPC_XY_VEL_MAX: 10.0
    MPC_ACC_HOR: 3.0
    MPC_JERK_AUTO: 4.0
    MPC_LAND_SPEED: 0.7
    MPC_LAND_CRWL: 0.1
    LNDMC_Z_VEL_MAX: 0.08
    LNDMC_XY_VEL_MAX: 1.5
    COM_DISARM_LAND: 2.0
    PLD_BTOUT: 0.5
    PLD_HACC_RAD: 0.5
    PLD_VEL_THR: 0.3
    # EKF local-z read 0.35 m above the cue at physical deck contact; 0.1 m
    # never entered FinalApproach, so thrust stayed high until vision recovery.
    PLD_FAPPR_ALT: 0.5
    PLD_SRCH_ALT: 5.0
    PLD_SRCH_TOUT: 10.0
    PLD_MAX_SRCH: 3

spawn:
  name: drone_cju_drone_spawn
  # Canonical map spawn is the integer track-centre point (5, 0).
  gazebo_spawn_pose_enu:
    x: -5.669916246818
    y: 65.542579972196
    z: 2.051
    roll: 0.0
    pitch: 0.0
    yaw: 1.680876358054

trailer:
  entity_name: trailer
  model_uri: model://moving_platform_aruco_velocity
  spawn_pose_enu:
    x: -5.669916246818
    y: 65.542579972196
    z: 0.0
    roll: 0.0
    pitch: 0.0
    # Gazebo VelocityControl consumes horizontal commands in model axes.
    yaw: 1.680876358054
  separation_m: 0.0
  motion: 50m_forward_then_50m_reverse_at_1_m_s
  command_topic: /model/trailer/cmd_vel
  pose_topic: /world/drone_cju/dynamic_pose/info
  odometry_topic: /model/trailer/odometry
  route_type: linear_shuttle
  # Track-centre shuttle, expressed in world ENU: map (5,0) -> (5,50).
  shuttle_endpoints_enu_m:
    - [-5.669916246818, 65.542579972196]
    - [-11.162808648995, 115.239945426092]
  shuttle_leg_length_m: 50
  route_length_m: 100
  patrol_mode: repeat
  command_rate_hz: 50.0
  cruise_speed_m_s: 1.0
  acceleration_m_s2: 3.0
  turnaround_creep_speed_m_s: 0.1
  turnaround_brake_margin_m: 0.05
  shuttle_spawn_tolerance_m: 0.01
  shuttle_yaw_tolerance_deg: 0.1
  shuttle_max_cross_track_error_m: 0.05
  shuttle_max_endpoint_excursion_m: 0.05
  shuttle_min_cruise_ratio: 0.99
  waypoint_tolerance_m: 0.2
  body_footprint_m: [5.0, 5.0]
  deck_height_m: 2.05
  marker_surface_height_m: 2.051
  aruco_dictionary: DICT_4X4_50
  marker_size_m: 1.3
  aruco_marker_id: 0
  small_marker_size_m: 0.30
  small_aruco_marker_id: 1
  marker_offset_m: [-1.1, 0.0]
  marker_2_offset_m: [1.1, 0.0]

terrain:
  type: flat_box
  coordinate_frame: stadium_endpoint
  center_m: [46, 49]
  size_m: [128, 226]
  ground_z_m: 0.0
  source_model: inline_stadium_ground

facilities:
  coordinate_frame: stadium_endpoint
  stadium_field: {center_m: [44, 48], size_m: [68, 105]}
  basketball_court: {center_m: [44, 113], size_m: [28, 15]}
  jokgu_court: {center_m: [44, -18], size_m: [10, 20]}

mission:
  coordinate_frame: stadium_endpoint
  command_topic: /mission/command
  command_sequence: [takeoff, mission, land]
  cruise_altitude_m: 5.0
  goal_m: [50, 50]
  planner_resolution_m: 1
  # Drone-centre clearance. Obstacles retain their physical YAML dimensions;
  # this radius accounts for the vehicle footprint in all runtime checks.
  vehicle_clearance_xy_m: 1.0
  # Additional planning reserve for PX4 tracking error. A*/SFC/B-spline use
  # the 1.0 m vehicle radius plus this 0.5 m reserve (1.5 m total).
  bspline_clearance_margin_m: 0.5
  bspline_control_spacing_m: 2.0
  bspline_sample_spacing_m: 0.1
  # Spatial route lookahead/fallback only. Runtime collision checks shorten it
  # near obstacles; TrackingMPC supplies the accepted P/V/A profile.
  mpc_path_lookahead_m: 6.0
  mpc_path_cross_track_m: 0.25
  # The gimbal stays nadir outside 10 m, blends toward the trailer from 10 to
  # 9 m (horizontal GPS/cue range), and points directly inside 9 m. LandingMPC entry requires
  # three distinct KF-accepted ArUco fixes within 0.5 s plus a live cue segment
  # that is safe under this same 1.5 m planning envelope.
  # Minimum period between moving-target A* -> SFC -> B-spline requests.
  # The prior certified route remains active while the worker replans.
  return_replan_min_period_s: 2.0
  obstacle_layout_seed: 5053
  obstacle_generation_bounds_m: {x: [0, 50], y: [0, 51]}
  # Seed-5053-based integer centres with selected Y coordinates adjusted,
  # plus five integer centres used by the denser 25-barrier test.
  obstacles:
    - {name: barrier_1, center_m: [33, 10, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_2, center_m: [18, 39, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_3, center_m: [21, 25, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_4, center_m: [49, 41, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_5, center_m: [31, 36, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_6, center_m: [45, 12, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_7, center_m: [39, 21, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_8, center_m: [42, 51, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_9, center_m: [17, 18, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_10, center_m: [22, 33, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_11, center_m: [44, 33, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_12, center_m: [24, 14, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_13, center_m: [39, 0, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_14, center_m: [30, 23, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_15, center_m: [49, 4, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_16, center_m: [21, 3, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_17, center_m: [15, 34, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_18, center_m: [42, 41, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_19, center_m: [35, 49, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_20, center_m: [28, 46, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_21, center_m: [12, 48, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_22, center_m: [50, 23, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_23, center_m: [12, 8, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_24, center_m: [30, 1, 5], size_m: [0.45, 0.35, 10]}
    - {name: barrier_25, center_m: [12, 25, 5], size_m: [0.45, 0.35, 10]}
